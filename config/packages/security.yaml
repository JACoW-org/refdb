security:
    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            access_token:
                token_handler: App\Security\IndicoAccessTokenHandler
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - App\Security\IndicoAuthenticator
            entry_point: App\Security\IndicoAuthenticator
            logout:
                path: app_logout
                target: homepage

    access_control:
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/sso/, roles: PUBLIC_ACCESS }
        - { path: ^/clean, roles: ROLE_ADMIN }
        - { path: /edit/, roles: ROLE_ADMIN }
        - { path: /delete/, roles: ROLE_ADMIN }
        - { path: /new, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: /upload, roles: ROLE_ADMIN }
